
name: Build Control de Gastos APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "Control_de_Gastos_Proyecto_Android.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java y Node
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Descomprimir proyecto
        run: |
          unzip -o Control_de_Gastos_Proyecto_Android.zip -d proyecto
          cd proyecto/Control_de_Gastos_Android
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Control-de-Gastos-APK-prueba
          path: proyecto/Control_de_Gastos_Android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
