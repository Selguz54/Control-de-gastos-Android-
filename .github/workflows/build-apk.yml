
name: Build Control de Gastos APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "Control_de_Gastos_Proyecto_Android.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java y Node
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Descomprimir proyecto
        run: |
          unzip -o Control_de_Gastos_Proyecto_Android_AdMob.zip -d proyecto
          cd proyecto
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713" />'
              s = re.sub(r'(<application\b[^>]*>)', r'\1\n        ' + meta, s, count=1)
              p.write_text(s)
          PY
          cd android
          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Control-de-Gastos-APK-prueba
          path: proyecto/Control_de_Gastos_Android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          
